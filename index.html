<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox BAAM!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Roboto:wght@400;700&display=swap');

        :root {
            --bg-color: #121212;
            --card-bg: #2C2C2C;
            --card-hover: #3D3D3D;
            --roblox-red: #E50914;
            --text-light: #FFFFFF;
            --points-green: #00b84c;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.7);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        /* Grid de Cartas */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 800px;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid #444;
            border-radius: 10px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card:hover {
            background-color: var(--card-hover);
            transform: scale(1.05);
            border-color: var(--text-light);
        }

        .card.clicked {
            background-color: #1a1a1a;
            border-color: #1a1a1a;
            color: #444;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Modal Padrão */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #222;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            border: 3px solid #555;
            position: relative;
            transform: scale(0.8);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-points {
            color: var(--points-green);
            font-weight: bold;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .modal-question {
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .modal-answer {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
            display: none; /* Escondido até revelar */
        }

        .btn {
            background-color: var(--roblox-red);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin: 5px;
        }

        .btn:hover {
            background-color: #b80710;
        }

        /* Estilo Específico BAAM */
        .modal-content.baam-style {
            border-color: var(--roblox-red);
            background: radial-gradient(circle, #3a0000 0%, #110000 100%);
        }

        .baam-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 4rem;
            color: var(--roblox-red);
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
            margin: 0 0 20px 0;
            transform: rotate(-5deg);
        }
    </style>
</head>
<body>

    <h1>Roblox BAAM!</h1>
    <div class="subtitle">Escolha um número. Cuidado com os BAAMs!</div>

    <div class="grid" id="grid"></div>

    <!-- Modal para Perguntas e BAAM -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content" id="modal-box">
            <div id="modal-points" class="modal-points"></div>
            <div id="modal-question" class="modal-question"></div>
            <div id="modal-answer" class="modal-answer"></div>
            
            <button class="btn" id="btn-reveal" onclick="revealAnswer()">Revelar Resposta</button>
            <button class="btn" onclick="closeModal()">🏠 Voltar para o Tabuleiro</button>
        </div>
    </div>

    <script>
        // Banco de perguntas sobre Roblox (19 perguntas)
        const questions = [
            { q: "Quem são os criadores originais do Roblox?", a: "David Baszucki e Erik Cassel", pts: 15 },
            { q: "Qual o nome da moeda virtual oficial do jogo?", a: "Robux", pts: 5 },
            { q: "Qual software é usado para criar os jogos dentro da plataforma?", a: "Roblox Studio", pts: 10 },
            { q: "Qual era o nome original do Roblox durante sua fase beta (2004)?", a: "DynaBlocks", pts: 20 },
            { q: "Em que ano o Roblox foi lançado oficialmente para o público?", a: "2006", pts: 15 },
            { q: "O que a sigla 'Obby' significa na plataforma?", a: "Obstacle Course (Pista de Obstáculos)", pts: 5 },
            { q: "Qual o nome da linguagem de programação usada no Roblox?", a: "Luau / Lua", pts: 15 },
            { q: "Como se chama o clássico som de morte do jogo que foi removido?", a: "Oof", pts: 10 },
            { q: "Qual é o nome do item de cabeça mais caro e cobiçado do catálogo (geralmente com capuz e botões)?", a: "Dominus", pts: 20 },
            { q: "Cite o nome de um jogo popular de Anime no Roblox.", a: "A Universal Time, Blox Fruits, Anime Defenders, etc.", pts: 10 },
            { q: "O que significa 'GFX' na comunidade de desenvolvedores do Roblox?", a: "Graphics (Imagens/Renders em 3D usando Blender, etc)", pts: 15 },
            { q: "Qual é o nome da assinatura mensal que dá benefícios extras?", a: "Roblox Premium (antigo Builders Club)", pts: 10 },
            { q: "Como se chama o clássico avatar amarelo, azul e verde?", a: "Noob", pts: 5 },
            { q: "Qual gênero de jogo no Roblox envolve construir sua própria base do zero gerando dinheiro automaticamente?", a: "Tycoon", pts: 10 },
            { q: "Qual ferramenta clássica (Gear) te faz pular muito alto?", a: "Gravity Coil (Mola de Gravidade)", pts: 15 },
            { q: "O que a sigla 'RP' significa em jogos como Brookhaven?", a: "Roleplay (Interpretação de Papéis)", pts: 5 },
            { q: "Como se chama o evento anual de premiação dos melhores criadores?", a: "Roblox Innovation Awards (Antigo Bloxy Awards)", pts: 15 },
            { q: "Se um jogador cai fora do mapa, o que acontece com ele?", a: "Ele é resetado / morre no Void", pts: 5 },
            { q: "Qual era a antiga moeda gratuita do Roblox antes de ser removida?", a: "Tix (Tickets)", pts: 20 }
        ];

        // Cria array do jogo com as 19 perguntas + 6 BAAMs
        let gameDeck = [...questions];
        for (let i = 0; i < 6; i++) {
            gameDeck.push({ type: 'baam' });
        }

        // Função para embaralhar os cards (Algoritmo Fisher-Yates)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        shuffle(gameDeck);

        const grid = document.getElementById('grid');
        const modal = document.getElementById('modal');
        const modalBox = document.getElementById('modal-box');
        const modPoints = document.getElementById('modal-points');
        const modQuestion = document.getElementById('modal-question');
        const modAnswer = document.getElementById('modal-answer');
        const btnReveal = document.getElementById('btn-reveal');

        // Renderizar Cards
        for (let i = 0; i < 25; i++) {
            let card = document.createElement('div');
            card.classList.add('card');
            card.innerText = i + 1;
            
            card.onclick = function() {
                if(this.classList.contains('clicked')) return;
                this.classList.add('clicked');
                this.innerText = "X";
                openModal(gameDeck[i]);
            };
            
            grid.appendChild(card);
        }

        function openModal(data) {
            modal.classList.add('active');
            modAnswer.style.display = 'none';
            
            if (data.type === 'baam') {
                modalBox.classList.add('baam-style');
                modPoints.innerText = "";
                modQuestion.innerHTML = "<h2 class='baam-title'>BAAM!</h2><p>Péssimas notícias! Sua equipe acabou de perder os pontos dessa rodada!</p>";
                btnReveal.style.display = 'none';
            } else {
                modalBox.classList.remove('baam-style');
                modPoints.innerText = `Valendo: ${data.pts} Pontos`;
                modQuestion.innerText = data.q;
                modAnswer.innerText = `Resposta: ${data.a}`;
                btnReveal.style.display = 'inline-block';
            }
        }

        function revealAnswer() {
            modAnswer.style.display = 'block';
            btnReveal.style.display = 'none';
        }

        function closeModal() {
            modal.classList.remove('active');
        }
    </script>
</body>
</html>
